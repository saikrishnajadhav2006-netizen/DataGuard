rules:
  - id: dataguard-java-system-out
    languages: [java]
    message: Replace standard output with structured logging.
    severity: WARNING
    patterns:
      - pattern: System.out.println(...)

  - id: dataguard-java-empty-catch
    languages: [java]
    message: Do not swallow exceptions silently.
    severity: ERROR
    pattern-regex: 'catch\\s*\\([^)]*\\)\\s*\\{\\s*\\}'
