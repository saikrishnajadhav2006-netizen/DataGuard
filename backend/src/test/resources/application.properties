# =================================================================
# Test-only overrides
# =================================================================

# Disable .env import (prevents production DB/secrets from leaking in)
spring.config.import=

# Force H2 in-memory DB
spring.datasource.url=jdbc:h2:mem:dataguard;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Exclude OpenAI (no key available during tests)
spring.autoconfigure.exclude=org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration
JWT_SECRET=dataguard-test-only-signing-key-32-bytes-minimum
