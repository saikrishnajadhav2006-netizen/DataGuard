# =====================================================================
# Spring profile: openai
#
# Activating this profile re-enables the Spring AI / OpenAI
# auto-configuration that is excluded by default in application.properties.
#
# Usage:
#   mvn spring-boot:run -Dspring-boot.run.profiles=openai
#   java -jar dataguard-backend.jar --spring.profiles.active=openai
#
# Environment variables required when this profile is active:
#   OPENAI_API_KEY — your OpenAI secret key
#   AI_MODEL       — model name (optional, default: gpt-4o-mini)
# =====================================================================

# Remove the default exclusion so OpenAI beans are created
spring.autoconfigure.exclude=

spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=${AI_MODEL:gpt-4o-mini}
