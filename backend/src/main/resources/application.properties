# =====================================================================
# DATABASE — Aiven PostgreSQL (or fallback to local H2)
# Provide these environment variables to connect to Aiven:
# DB_URL=jdbc:postgresql://<aiven-host>:<port>/<dbname>?sslmode=require
# DB_USERNAME=avnadmin
# DB_PASSWORD=<password>
# DB_DRIVER=org.postgresql.Driver
# DB_PLATFORM=org.hibernate.dialect.PostgreSQLDialect
# =====================================================================
spring.datasource.url=${DB_URL:jdbc:h2:mem:dataguard;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.jpa.database-platform=${DB_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 console (dev only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =====================================================================
# SPRING AI — OpenAI (optional)
#
# AI features are DISABLED by default so the app starts without any
# API key.  To enable:
#   1. Set OPENAI_API_KEY in your environment.
#   2. Start with the 'openai' Spring profile:
#        mvn spring-boot:run -Dspring-boot.run.profiles=openai
#      or
#        java -jar dataguard-backend.jar --spring.profiles.active=openai
#
# Without the profile the OpenAI auto-configuration is excluded and
# AIService gracefully returns without calling the model.
# =====================================================================
spring.autoconfigure.exclude=org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration

# =====================================================================
# SUPABASE AUTH — disabled by default for local MVP
# =====================================================================
supabase.auth.enabled=${SUPABASE_AUTH_ENABLED:false}

# =====================================================================
# JWT
# =====================================================================
dataguard.security.jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# =====================================================================
# MULTIPART — Spring-level guard (last resort; DataGuard validates first)
# Allow up to 30 MB so a 25 MB ZIP upload can pass through
# =====================================================================
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=30MB

# =====================================================================
# DATAGUARD REVIEW LIMITS
# DATAGUARD_MAX_UPLOAD_BYTES        — max raw ZIP upload (default 5 MB)
# DATAGUARD_MAX_UNCOMPRESSED_BYTES  — max total extracted size (default 25 MB)
# DATAGUARD_MAX_FILES               — max number of files in ZIP (default 200)
# DATAGUARD_MAX_SINGLE_FILE_BYTES   — max single extracted file (default 1 MB)
# =====================================================================
dataguard.upload.max-upload-bytes=${DATAGUARD_MAX_UPLOAD_BYTES:26214400}
dataguard.upload.max-uncompressed-bytes=${DATAGUARD_MAX_UNCOMPRESSED_BYTES:104857600}
dataguard.upload.max-files=${DATAGUARD_MAX_FILES:200}
dataguard.upload.max-single-file-bytes=${DATAGUARD_MAX_SINGLE_FILE_BYTES:1048576}

# =====================================================================
# SEMGREP — configurable; must be on PATH or override SEMGREP_COMMAND
# =====================================================================
dataguard.semgrep.command=${SEMGREP_COMMAND:semgrep}
dataguard.semgrep.config=${SEMGREP_CONFIG:semgrep.yml}
dataguard.semgrep.timeout-seconds=${SEMGREP_TIMEOUT_SECONDS:120}
dataguard.semgrep.enabled=${SEMGREP_ENABLED:true}

# =====================================================================
# GITHUB INTEGRATION
# =====================================================================
dataguard.github.app-id=${GITHUB_APP_ID:}
dataguard.github.private-key-path=${GITHUB_PRIVATE_KEY_PATH:}
dataguard.github.webhook-secret=${GITHUB_WEBHOOK_SECRET:}
spring.config.import=optional:file:../.env[.properties]

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
