# Local H2 is the default. Configure DB_* environment variables for Supabase.
spring.datasource.url=${DB_URL:jdbc:h2:mem:dataguard;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.jpa.database-platform=${DB_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Optional AI configuration. Keep secrets in environment variables.
spring.ai.openai.api-key=${AI_API_KEY:}
spring.ai.openai.chat.options.model=${AI_MODEL:gpt-4o-mini}
spring.autoconfigure.exclude=${SPRING_AUTOCONFIGURE_EXCLUDE:org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration}

# Supabase Auth is enabled only when explicitly configured.
supabase.auth.enabled=${SUPABASE_AUTH_ENABLED:false}

# Repository upload guardrails.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
dataguard.review.max-uncompressed-bytes=${DATAGUARD_REVIEW_MAX_UNCOMPRESSED_BYTES:104857600}
