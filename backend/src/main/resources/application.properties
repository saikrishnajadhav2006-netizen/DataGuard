spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# Aiven PostgreSQL is required; there is no silent in-memory database fallback.
spring.datasource.url=\${DB_URL}
spring.datasource.username=\${DB_USERNAME}
spring.datasource.password=\${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Spring Boot JWT; keep JWT_SECRET private and at least 32 UTF-8 bytes.
dataguard.security.jwt.expiration=\${JWT_EXPIRATION_MS:86400000}

# Optional Groq API integration (server-side only).
groq.base-url=\${GROQ_BASE_URL:https://api.groq.com/openai/v1}
groq.api-key=\${GROQ_API_KEY:}
groq.model=\${GROQ_MODEL:llama-3.3-70b-versatile}

server.port=8080
app.cors.allowed-origins=\${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
dataguard.review.max-uncompressed-bytes=\${DATAGUARD_REVIEW_MAX_UNCOMPRESSED_BYTES:104857600}
