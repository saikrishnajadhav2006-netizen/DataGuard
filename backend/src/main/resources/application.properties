spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# Aiven PostgreSQL is required; there is no silent in-memory database fallback.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate

# Versioned schema changes are applied by Flyway before Hibernate validates the mappings.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Spring Boot JWT; keep JWT_SECRET private and at least 32 UTF-8 bytes.
dataguard.security.jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# Optional Groq API integration (server-side only).
groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
groq.api-key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}

# Gemini Flash fallback. Set GEMINI_API_KEY in the backend environment only.
gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}

server.port=${PORT:8080}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
spring.servlet.multipart.max-file-size=25MB
# Permit multipart framing while the uploaded file itself is limited to 25 MB.
spring.servlet.multipart.max-request-size=26MB
dataguard.review.max-uncompressed-bytes=${DATAGUARD_REVIEW_MAX_UNCOMPRESSED_BYTES:104857600}
dataguard.storage.directory=${DATAGUARD_STORAGE_DIR:${java.io.tmpdir}}
dataguard.semgrep.enabled=${SEMGREP_ENABLED:false}
dataguard.semgrep.executable=${SEMGREP_EXECUTABLE:semgrep}
dataguard.semgrep.config=${SEMGREP_CONFIG:p/security-audit}
dataguard.semgrep.timeout-seconds=${SEMGREP_TIMEOUT_SECONDS:90}

# Multi-language syntax parsing via tree-sitter-language-pack (installed in the backend image).
dataguard.syntax.python-executable=${DATAGUARD_PYTHON_EXECUTABLE:python}
dataguard.syntax.timeout-seconds=${DATAGUARD_SYNTAX_TIMEOUT_SECONDS:90}

# Optional PMD code-quality rules; enabled in the production Docker image.
dataguard.pmd.enabled=${DATAGUARD_PMD_ENABLED:false}
dataguard.pmd.executable=${DATAGUARD_PMD_EXECUTABLE:pmd}
dataguard.pmd.ruleset=${DATAGUARD_PMD_RULESET:rulesets/java/quickstart.xml}
dataguard.pmd.timeout-seconds=${DATAGUARD_PMD_TIMEOUT_SECONDS:90}

# GitHub App webhook / Check Run integration. Configure secrets in the Render service environment.
dataguard.github.app-id=${GITHUB_APP_ID:}
dataguard.github.private-key=${GITHUB_APP_PRIVATE_KEY:}
dataguard.github.webhook-secret=${GITHUB_WEBHOOK_SECRET:}
