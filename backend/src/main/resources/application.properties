# Load repository-root .env for local development
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# Database configuration
spring.datasource.url=${DB_URL:jdbc:h2:mem:dataguard;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.database-platform=${DB_PLATFORM:org.hibernate.dialect.H2Dialect}

# Keep existing schema during local development
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Groq AI
groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
groq.api-key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}

# Service port
server.port=8080

# Comma-separated frontend origins. Override CORS_ALLOWED_ORIGINS outside local development.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Upload guardrails
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
dataguard.review.max-uncompressed-bytes=${DATAGUARD_REVIEW_MAX_UNCOMPRESSED_BYTES:104857600}