name: DataGuard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: dataguard
          POSTGRES_USER: dataguard
          POSTGRES_PASSWORD: dataguard_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dataguard -d dataguard"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_URL: jdbc:postgresql://localhost:5432/dataguard
      DB_USERNAME: dataguard
      DB_PASSWORD: dataguard_test_password
      JWT_SECRET: ci-only-test-secret-with-at-least-32-utf8-bytes
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      DATAGUARD_INTEGRATION_TESTS: "true"
      DATAGUARD_PYTHON_EXECUTABLE: python3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install syntax parser runtime
        run: python -m pip install --disable-pip-version-check tree-sitter-language-pack==0.13.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compile and test backend
        working-directory: backend
        run: mvn --batch-mode clean verify

  backend-container:
    name: Backend Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build deployment image
        run: docker build --tag dataguard-backend-ci ./backend

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Check AI Radar browser script syntax
        working-directory: frontend
        run: node --check public/dataguard-ai-radar.js
      - name: Check standalone dashboard inline scripts and auth wiring
        working-directory: frontend
        run: node scripts/check-inline-scripts.mjs
